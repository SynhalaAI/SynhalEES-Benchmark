name: Leaderboard data in sync

on:
  push:
  pull_request:

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check docs/assets/data is up to date with submissions/
        run: python tools/build_leaderboard.py --check
