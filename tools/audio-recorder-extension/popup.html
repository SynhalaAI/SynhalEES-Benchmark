<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Audio Recorder</title>
  <style>
    html, body {
      height: 100%;
    }
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1f22;
      color: #f0f0f0;
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-controls {
      padding: 16px 16px 8px 16px;
      flex: 0 0 auto;
    }
    .recordings-scroll-area {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 0 16px 16px 16px;
      border-top: 1px solid #333;
    }
    .recordings-scroll-area::-webkit-scrollbar {
      width: 6px;
    }
    .recordings-scroll-area::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 14px 0;
      font-weight: 600;
      text-align: center;
    }
    .timer {
      text-align: center;
      font-size: 28px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 14px;
      color: #fff;
    }
    .status {
      text-align: center;
      font-size: 12px;
      color: #9aa0a6;
      margin-bottom: 14px;
      min-height: 16px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    button {
      flex: 1;
      padding: 10px 8px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #startBtn { background: #e53935; color: white; }
    #pauseBtn { background: #f5a623; color: #1e1f22; }
    #stopBtn  { background: #444; color: white; }
    button:hover:not(:disabled) { opacity: 0.85; }

    .rec-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e53935;
      margin-right: 6px;
      vertical-align: middle;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    #recordingsList {
      margin-top: 6px;
    }
    .recording-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2a2b2e;
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .recording-item a {
      color: #8ab4f8;
      text-decoration: none;
    }
    .recording-item a:hover { text-decoration: underline; }

    .option-row {
      background: #2a2b2e;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .option-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .option-label select {
      background: #1e1f22;
      color: #f0f0f0;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12px;
    }
    .switch-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .switch-label input[type="checkbox"] {
      width: 32px;
      height: 18px;
      cursor: pointer;
    }
    #autoStatus {
      font-size: 11px;
      color: #f5a623;
      min-height: 14px;
      margin-bottom: 4px;
    }

    .recording-card {
      background: #2a2b2e;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .recording-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      color: #ccc;
    }
    .player-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .player-row button {
      flex: 0 0 auto;
      padding: 6px 10px;
      font-size: 11px;
      background: #3a3b3e;
      color: #f0f0f0;
      border-radius: 6px;
    }
    .player-row .time-label {
      font-size: 11px;
      color: #9aa0a6;
      min-width: 70px;
      text-align: right;
    }
    .waveform-canvas {
      width: 100%;
      height: 50px;
      display: block;
      background: #1e1f22;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .trim-row {
      margin-bottom: 8px;
    }
    .trim-sliders {
      position: relative;
      height: 26px;
      margin-bottom: 4px;
    }
    .trim-sliders input[type="range"] {
      position: absolute;
      width: 100%;
      top: 8px;
      background: transparent;
      pointer-events: none;
      -webkit-appearance: none;
    }
    .trim-sliders input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      pointer-events: auto;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #8ab4f8;
      cursor: pointer;
      margin-top: -4px;
    }
    .trim-sliders input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: #444;
      border-radius: 2px;
    }
    .trim-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #9aa0a6;
      margin-bottom: 6px;
    }
    .card-actions {
      display: flex;
      gap: 6px;
    }
    .card-actions button, .card-actions a {
      flex: 1;
      text-align: center;
      padding: 6px 2px;
      font-size: 10px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-trim { background: #f5a623; color: #1e1f22; border: none; }
    .btn-download { background: #4caf50; color: white; }
    .btn-reset { background: #555; color: white; border: none; }
    .btn-remove { background: #e53935; color: white; border: none; }
  </style>
</head>
<body>
  <div class="top-controls">
    <h1>🎙️ Simple Audio Recorder</h1>
    <div class="timer" id="timer">00:00</div>
    <div class="status" id="status">Ready to record</div>

    <div class="btn-row">
      <button id="startBtn">Start</button>
      <button id="pauseBtn" disabled>Pause</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>

    <div class="option-row">
      <label class="option-label">
        <span>Source</span>
        <select id="sourceSelect">
          <option value="tab">Current Tab Audio</option>
          <option value="mic">Microphone</option>
        </select>
      </label>
    </div>

    <div class="option-row">
      <label class="option-label">
        <span>Format</span>
        <select id="formatSelect">
          <option value="webm">WEBM</option>
          <option value="mp3">MP3</option>
        </select>
      </label>
    </div>

    <div class="option-row">
      <label class="switch-label">
        <span>Auto start / stop with sound</span>
        <input type="checkbox" id="autoDetectToggle">
      </label>
    </div>
    <div class="status" id="autoStatus"></div>
  </div>

  <div class="recordings-scroll-area">
    <div id="recordingsList"></div>
  </div>

  <script src="lame.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
