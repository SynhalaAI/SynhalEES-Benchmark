[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synhalees"
version = "0.1.0"
description = "SynhalEES: The Multimodal Sinhala Cultural Benchmark (API-driven, checkpointed)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Zero runtime dependencies: model calls use the Python standard library.
dependencies = []

[tool.setuptools.packages.find]
include = ["synhalees*"]